name: Daily RSS update

on:
  schedule:
    # 11:17 JST = 02:17 UTC
    - cron:  '17 2 * * *'
  workflow_dispatch:
    inputs:
      yymmdd:
        description: '日付 (YYMMDD format, e.g., 250520)'
        required: false
        type: string
      pipeline:
        description: 'Pipeline to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - arxiv
          - aps
          - nature
          - chemrxiv

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'

      - name: Install deps
        run: |
          uv sync --no-dev

      - name: Run generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.yymmdd }}" ]; then
            ARGS="$ARGS --yymmdd ${{ github.event.inputs.yymmdd }}"
          fi
          if [ -n "${{ github.event.inputs.pipeline }}" ]; then
            ARGS="$ARGS --pipeline ${{ github.event.inputs.pipeline }}"
          fi
          uv run src/main.py $ARGS

      # 生成ファイルをコミット
      - name: Commit & push RSS
        uses: EndBug/add-and-commit@v9
        with:
          add: 'docs/*.xml'
          default_author: github_actions
          message: 'chore: update RSS feed'
          new_branch: gh-pages
          push: '--set-upstream origin gh-pages --force'
