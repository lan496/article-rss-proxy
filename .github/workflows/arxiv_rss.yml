name: Daily RSS update

on:
  schedule:
    # 11:17 JST = 02:17 UTC
    - cron:  '17 2 * * *'
  workflow_dispatch:
    inputs:
      yymmdd:
        description: '日付 (YYMMDD format, e.g., 250520)'
        required: false
        type: string
      pipeline:
        description: 'Pipeline to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - arxiv
          - aps
          - nature
          - chemrxiv

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'

      - name: Install deps
        run: |
          uv sync --no-dev

      - name: Run generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.yymmdd }}" ]; then
            ARGS="$ARGS --yymmdd ${{ github.event.inputs.yymmdd }}"
          fi
          if [ -n "${{ github.event.inputs.pipeline }}" ]; then
            ARGS="$ARGS --pipeline ${{ github.event.inputs.pipeline }}"
          fi
          uv run src/main.py $ARGS

      # 生成ファイルをコミット
      - name: Commit & push RSS
        id: commit_rss
        uses: EndBug/add-and-commit@v9
        with:
          add: 'docs/*.xml'
          default_author: github_actions
          message: 'chore: update RSS feed'
          new_branch: gh-pages
          push: '--set-upstream origin gh-pages --force'

      # The auto-generated "pages build and deployment" workflow sometimes fails
      # with "Deployment failed, try again later." and leaves the Pages build
      # stuck in "building" (e.g. runs 28696918544, 28781547136). Requesting a
      # fresh build via the API recovers it, so poll the build status here and
      # retry until the pushed commit is deployed.
      - name: Verify Pages deployment (retry stuck builds)
        if: steps.commit_rss.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.commit_rss.outputs.commit_long_sha }}
        run: |
          for attempt in 1 2 3; do
            for i in $(seq 1 20); do
              status=$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" --jq '.status')
              commit=$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" --jq '.commit')
              if [ "$commit" = "$EXPECTED_SHA" ] && [ "$status" = "built" ]; then
                echo "Pages build for $EXPECTED_SHA completed."
                exit 0
              fi
              if [ "$commit" = "$EXPECTED_SHA" ] && [ "$status" = "errored" ]; then
                break
              fi
              sleep 15
            done
            echo "Pages build incomplete (status=$status commit=$commit); requesting a fresh build (attempt $attempt)."
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds"
          done
          echo "::error::GitHub Pages deployment for $EXPECTED_SHA did not complete after retries."
          exit 1
