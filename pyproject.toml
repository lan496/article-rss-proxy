[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "article-rss-proxy"
version = "0.1.0"
description = "A tool to fetch papers, filter and translate them using Gemini, and deliver them as RSS feeds."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "オマージュ海老", email = "hommage.ebi@gmail.com" },
]

dependencies = [
    "feedgen==1.0.0",
    "requests>=2.31",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "python-dateutil>=2.9",
    "google-genai>=0.4.0", # Gemini SDK
    "python-dotenv>=1.0",
    "joblib>=1.5.0",
    "click>=8.0",
    "cloudscraper>=1.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
exclude-newer = "1 week"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "ruff>=0.11.10",
    "pre-commit",
]

[tool.ruff]
line-length = 99
exclude = ["examples/"]

[tool.ruff.lint]
extend-select = [
    "I",
]
ignore = ["E741"]

[tool.ruff.lint.isort]
lines-after-imports = 2
force-single-line = false
force-sort-within-sections = true
order-by-type = false
